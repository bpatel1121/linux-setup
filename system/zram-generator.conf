# Compressed RAM swap. zram-generator ships no default config and does nothing
# without one, so this file is what actually creates /dev/zram0.
#
# Size is left at the default (min(RAM/2, 4G)) — deliberately not pinned, so the
# same file is right on a 8G laptop and a 64G desktop. Installed to
# /etc/systemd/zram-generator.conf by setup.sh; takes effect at the next boot.
[zram0]
compression-algorithm = zstd
