# ~/.config/alacritty/alacritty.toml
# Generated by configurator.fyi/alacritty

[font]
size = 12

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "full"

[cursor]
style = { shape = "Block", blinking = "On" }

[scrolling]
history = 10000

[selection]
save_to_clipboard = false

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
cursor = "#c0caf5"
text = "#1a1b26"

[colors.selection]
background = "#283457"
text = "CellForeground"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

